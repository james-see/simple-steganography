[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-steganography"
version = "1.0.6"
description = "A simple Python steganography tool for hiding messages in images"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "James Campbell", email = "james@jamescampbell.us" }]
maintainers = [{ name = "James Campbell", email = "james@jamescampbell.us" }]
keywords = ["steganography", "images", "png", "cryptography", "metadata"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "pillow>=10.0.0",
    "stepic>=0.5.0",
]

[project.urls]
Homepage = "https://github.com/james-see/simple-steganography"
Repository = "https://github.com/james-see/simple-steganography"
Issues = "https://github.com/james-see/simple-steganography/issues"

[project.scripts]
simple-steganography = "simple_steganography:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.setuptools]
py-modules = ["simple_steganography", "ss"]

[tool.coverage.run]
branch = true
source = ["simple_steganography"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-q"
